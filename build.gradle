plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id "me.modmuss50.mod-publish-plugin" version "2.2.1"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def releaseType = release_type.toString()
if (!(releaseType in ['release', 'beta', 'alpha']))
    throw new GradleException("release_type invalido: '$releaseType' (release|beta|alpha)")
def typeSuffix = releaseType == 'release' ? '' : "-${releaseType.toUpperCase()}"

version = "${mod_version}+${minecraft_version}${typeSuffix}"
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    flatDir(
            dirs: 'libs'
    )
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    java {
        withSourcesJar()
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : version
    ]
    inputs.properties(replaceProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def getChangelogText() {
    def changelogFile = file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog found."
    }
    def text = changelogFile.text
    def matcher = text =~ /(?s)^(# .*?\n)(.*?)(?=\n# |\n---|\Z)/

    if (matcher.find()) {
        return matcher.group(2).trim()
    }
    return text.trim()
}

def gitCommit = providers.gradleProperty('gitCommit')
        .orElse(providers.exec {
            commandLine('git', 'rev-parse', '--short', 'HEAD')
        }.standardOutput.asText.map { it.trim() })

def modVersion = version.toString()
def modName = mod_name.toString()

if (providers.gradleProperty('build.release').isPresent()) {
    publishMods {
        dryRun = providers.gradleProperty('build.release.dryrun').isPresent()

        file = jar.archiveFile
        changelog = getChangelogText()
        type = releaseType == 'alpha' ? ALPHA : releaseType == 'beta' ? BETA : STABLE
        modLoaders.add("neoforge")

        curseforge {
            accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
            projectId = curseforge_id
            minecraftVersions.add(minecraft_version)
            javaVersions.add(JavaVersion.VERSION_21)
            client = true
            server = true
            requires("cloth-config")
            requires("heros-lib")
            changelogType = "markdown"
            displayName = "${modName} ${modVersion}"
            version = modVersion
        }
        modrinth {
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            projectId = modrinth_id
            minecraftVersions.add(minecraft_version)
            requires("cloth-config")
            requires("heros-lib")
            environment = CLIENT_AND_SERVER
            displayName = "${modName} ${modVersion}"
            version = modVersion
        }
        github {
            accessToken = providers.environmentVariable("GITHUB_TOKEN")
            repository = "Herobrot/${mod_id}"
            tagName = modVersion
            displayName = "${modName} ${modVersion}"
            commitish = gitCommit
            version = modVersion
            additionalFiles.from(tasks.named("sourcesJar"))
        }
    }
} else if (gradle.startParameter.taskNames.any { it.endsWith('publishMods') })
    throw new GradleException("publishMods requiere -Pbuild.release=true (usa -Pbuild.release.dryrun=true para prueba)")

tasks.named('publishMods') {
    outputs.upToDateWhen { false }
}